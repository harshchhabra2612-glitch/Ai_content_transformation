# QLoRA Supervised Fine-Tuning Configuration for ERA Llama 3.2 3B Instruct

model_config:
  base_model_name_or_path: "meta-llama/Llama-3.2-3B-Instruct"
  torch_dtype: "bfloat16"
  device_map: "auto"
  use_cache: false

quantization_config:
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_use_double_quant: true

lora_config:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

training_args:
  output_dir: "training/outputs/llama32_3b_era_lora"
  num_train_epochs: 3
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 0.0002
  weight_decay: 0.01
  warmup_ratio: 0.03
  lr_scheduler_type: "cosine"
  max_seq_length: 2048
  eval_strategy: "steps"
  eval_steps: 50
  save_strategy: "steps"
  save_steps: 50
  save_total_limit: 2
  logging_steps: 10
  fp16: false
  bf16: true
  dataset_text_field: "text"
  packing: false
  early_stopping_patience: 3
